# The whole stack: the database from compose.yaml, the server and one
# agent, built from source.
#
#   docker compose -f compose.stack.yaml up -d --build --wait
#
# CISID_AGENT_TOKEN is required, in the environment or an .env file; the
# forges' settings are optional. See docs/deployment.md.
include:
  - compose.yaml

services:
  server:
    build:
      context: .
      target: server
    image: cisid-server:dev
    environment:
      CISID_DATABASE_URL: postgres://cisid:cisid@postgres:5432/cisid?sslmode=disable
      CISID_GITHUB_WEBHOOK_SECRET: ${CISID_GITHUB_WEBHOOK_SECRET:-}
      CISID_AGENT_TOKEN: ${CISID_AGENT_TOKEN:?set CISID_AGENT_TOKEN}
      CISID_API_TOKEN: ${CISID_API_TOKEN:-}
      CISID_READ_TOKEN: ${CISID_READ_TOKEN:-}
      CISID_SECRET_KEY: ${CISID_SECRET_KEY:-}
      CISID_GITHUB_TOKEN: ${CISID_GITHUB_TOKEN:-}
      CISID_GITHUB_API_URL: ${CISID_GITHUB_API_URL:-}
      CISID_GITEA_URL: ${CISID_GITEA_URL:-}
      CISID_GITEA_TOKEN: ${CISID_GITEA_TOKEN:-}
      CISID_GITEA_WEBHOOK_SECRET: ${CISID_GITEA_WEBHOOK_SECRET:-}
      CISID_FORGEJO_URL: ${CISID_FORGEJO_URL:-}
      CISID_FORGEJO_TOKEN: ${CISID_FORGEJO_TOKEN:-}
      CISID_FORGEJO_WEBHOOK_SECRET: ${CISID_FORGEJO_WEBHOOK_SECRET:-}
      CISID_GITLAB_URL: ${CISID_GITLAB_URL:-}
      CISID_GITLAB_TOKEN: ${CISID_GITLAB_TOKEN:-}
      CISID_GITLAB_WEBHOOK_SECRET: ${CISID_GITLAB_WEBHOOK_SECRET:-}
      CISID_BITBUCKET_TOKEN: ${CISID_BITBUCKET_TOKEN:-}
      CISID_BITBUCKET_WEBHOOK_SECRET: ${CISID_BITBUCKET_WEBHOOK_SECRET:-}
      CISID_POLL_INTERVAL: ${CISID_POLL_INTERVAL:-}
      CISID_READ_ACCESS: ${CISID_READ_ACCESS:-}
      CISID_SESSION_TTL: ${CISID_SESSION_TTL:-}
      CISID_ADMIN_USER: ${CISID_ADMIN_USER:-}
      CISID_ADMIN_PASSWORD: ${CISID_ADMIN_PASSWORD:-}
      CISID_GITHUB_OAUTH_CLIENT_ID: ${CISID_GITHUB_OAUTH_CLIENT_ID:-}
      CISID_GITHUB_OAUTH_CLIENT_SECRET: ${CISID_GITHUB_OAUTH_CLIENT_SECRET:-}
      CISID_GITEA_OAUTH_CLIENT_ID: ${CISID_GITEA_OAUTH_CLIENT_ID:-}
      CISID_GITEA_OAUTH_CLIENT_SECRET: ${CISID_GITEA_OAUTH_CLIENT_SECRET:-}
      CISID_FORGEJO_OAUTH_CLIENT_ID: ${CISID_FORGEJO_OAUTH_CLIENT_ID:-}
      CISID_FORGEJO_OAUTH_CLIENT_SECRET: ${CISID_FORGEJO_OAUTH_CLIENT_SECRET:-}
      CISID_GITLAB_OAUTH_CLIENT_ID: ${CISID_GITLAB_OAUTH_CLIENT_ID:-}
      CISID_GITLAB_OAUTH_CLIENT_SECRET: ${CISID_GITLAB_OAUTH_CLIENT_SECRET:-}
      CISID_BITBUCKET_OAUTH_CLIENT_ID: ${CISID_BITBUCKET_OAUTH_CLIENT_ID:-}
      CISID_BITBUCKET_OAUTH_CLIENT_SECRET: ${CISID_BITBUCKET_OAUTH_CLIENT_SECRET:-}
      CISID_GOOGLE_OAUTH_CLIENT_ID: ${CISID_GOOGLE_OAUTH_CLIENT_ID:-}
      CISID_GOOGLE_OAUTH_CLIENT_SECRET: ${CISID_GOOGLE_OAUTH_CLIENT_SECRET:-}
      CISID_GOOGLE_DOMAIN: ${CISID_GOOGLE_DOMAIN:-}
      CISID_OAUTH_SIGNUP_ROLE: ${CISID_OAUTH_SIGNUP_ROLE:-}
      CISID_PUBLIC_URL: ${CISID_PUBLIC_URL:-}
      CISID_LOG_RETENTION: ${CISID_LOG_RETENTION:-}
      CISID_BUILD_FORKS: ${CISID_BUILD_FORKS:-}
      CISID_PUBLIC_BADGES: ${CISID_PUBLIC_BADGES:-}
      CISID_ARTIFACT_MAX_SIZE: ${CISID_ARTIFACT_MAX_SIZE:-}
      # Email notifications; see docs/notifications.md.
      CISID_SMTP_HOST: ${CISID_SMTP_HOST:-}
      CISID_SMTP_PORT: ${CISID_SMTP_PORT:-}
      CISID_SMTP_USERNAME: ${CISID_SMTP_USERNAME:-}
      CISID_SMTP_PASSWORD: ${CISID_SMTP_PASSWORD:-}
      CISID_SMTP_FROM: ${CISID_SMTP_FROM:-}
      CISID_SMTP_TLS: ${CISID_SMTP_TLS:-}
      # Tracing is off unless a collector is given; see docs/tracing.md.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${CISID_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

  agent:
    build:
      context: .
      target: agent
    image: cisid-agent:dev
    environment:
      CISID_SERVER_URL: ws://server:8080/agent/ws
      # Defaults to the container hostname, so "--scale agent=N" gives
      # each replica its own name.
      CISID_AGENT_NAME: ${CISID_AGENT_NAME:-}
      CISID_AGENT_LABELS: ${CISID_AGENT_LABELS:-}
      CISID_AGENT_TOKEN: ${CISID_AGENT_TOKEN:?set CISID_AGENT_TOKEN}
      CISID_STEP_MEMORY: ${CISID_STEP_MEMORY:-}
      CISID_STEP_CPUS: ${CISID_STEP_CPUS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      # The agent starts step containers on the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      server:
        condition: service_healthy
