# cisid builds itself: vet, then every test with the race detector, including
# the PostgreSQL integration tests against a service container. Tests that
# need Docker skip themselves here. Then the Helm chart is rendered and
# checked (a module of its own, see deployments/helm/charttest).
# Go's module and build caches survive between jobs on each agent.
cache:
  - /go/pkg/mod
  - /root/.cache/go-build

services:
  - name: postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: cisid

steps:
  - name: test
    image: golang:1.27
    environment:
      CISID_TEST_DATABASE_URL: postgres://postgres:cisid@postgres:5432/postgres?sslmode=disable
    commands:
      - go vet ./...
      - go test -race ./...
    timeout: 15m

  - name: chart
    image: golang:1.27
    commands:
      - cd deployments/helm/charttest
      - go vet ./...
      - go test ./...
    timeout: 10m
