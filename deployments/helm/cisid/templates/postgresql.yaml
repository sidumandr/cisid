{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cisid.postgresqlName" . }}
  labels:
    {{- include "cisid.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  selector:
    {{- include "cisid.selectorLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cisid.postgresqlName" . }}
  labels:
    {{- include "cisid.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ include "cisid.postgresqlName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cisid.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cisid.componentLabels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The postgres user of the Alpine image.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ include "cisid.image" (dict "root" . "image" .Values.postgresql.image) | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: cisid
            - name: POSTGRES_DB
              value: cisid
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cisid.secretName" . }}
                  key: postgres-password
          readinessProbe:
            exec:
              command: ["pg_isready", "--host=127.0.0.1", "--username=cisid", "--dbname=cisid"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "--host=127.0.0.1", "--username=cisid", "--dbname=cisid"]
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cisid.selectorLabels" (dict "root" . "component" "postgresql") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
  {{- end }}
{{- if .Values.postgresql.networkPolicy.enabled }}
---
# Only the server may connect to the database; steps run in the cluster too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cisid.postgresqlName" . }}
  labels:
    {{- include "cisid.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cisid.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cisid.selectorLabels" (dict "root" . "component" "server") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- end }}
