{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cisid.serviceAccountName" . }}
  labels:
    {{- include "cisid.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# cisid does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
