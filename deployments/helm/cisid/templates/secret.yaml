{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cisid.secretName" . }}
  labels:
    {{- include "cisid.labels" . | nindent 4 }}
type: Opaque
data:
  agent-token: {{ .Values.secrets.agentToken | b64enc | quote }}
  {{- with .Values.secrets.readToken }}
  read-token: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.apiToken }}
  api-token: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.secretKey }}
  secret-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := include "cisid.forgeSecrets" . | fromYaml }}
  {{- with $value }}
  {{ $key }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  database-url: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
{{- end }}
