<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>cisid</title>
  <link rel="icon" href="/ui/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/ui/fonts/authentic-sans-90.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/ui/fonts/authentic-sans-130.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/ui/app.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="wordmark" href="/">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect class="mark-step" x="2" y="9" width="6" height="6"/>
          <rect class="mark-step" x="9" y="9" width="6" height="6"/>
          <rect class="mark-run" x="16" y="9" width="6" height="6"/>
        </svg>
        cisid
      </a>
    </header>
    <nav class="rail" aria-label="Main">
      <a class="mark" href="/" aria-label="cisid">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <rect class="mark-step" x="2" y="9" width="6" height="6"/>
          <rect class="mark-step" x="9" y="9" width="6" height="6"/>
          <rect class="mark-run" x="16" y="9" width="6" height="6"/>
        </svg>
      </a>
      <a class="rail-item" href="/" data-nav="jobs" title="Jobs">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="rail-label">Jobs</span>
      </a>
      <a class="rail-item" href="/repos" data-nav="repos" title="Repositories">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 3.5h12v17H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5zM4.5 17.5A1.5 1.5 0 0 1 6 16h12"/></svg>
        <span class="rail-label">Repositories</span>
      </a>
      <a class="rail-item" href="/users" data-nav="users" title="Users" id="nav-users" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14a6.5 6.5 0 0 1 3 5.5"/></svg>
        <span class="rail-label">Users</span>
      </a>
      <a class="rail-item rail-end" href="/account" data-nav="account" title="Sign in" id="nav-account">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5a8 8 0 0 1 16 0"/></svg>
        <span class="rail-label" id="account-label">Sign in</span>
      </a>
      <button class="rail-item" id="theme" type="button" title="Switch light and dark">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path class="fill" d="M12 4.5a7.5 7.5 0 0 1 0 15z"/></svg>
        <span class="rail-label">Theme</span>
      </button>
    </nav>
    <main id="app" class="canvas" aria-live="polite"></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
